<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d4a017"/>
    </marker>
  </defs>

  <!-- zones -->
  <rect x="10" y="70" width="230" height="130" rx="14" fill="none" stroke="#8b949e" stroke-opacity="0.5" stroke-dasharray="5 5"/>
  <text x="24" y="191" font-size="11" fill="#8b949e" letter-spacing="1">YOU</text>
  <rect x="260" y="70" width="690" height="130" rx="14" fill="none" stroke="#8b949e" stroke-opacity="0.5" stroke-dasharray="5 5"/>
  <text x="936" y="191" text-anchor="end" font-size="11" fill="#8b949e" letter-spacing="1">NOIR SERVER · NO HUMAN IN THE LOOP</text>

  <!-- stages -->
  <g font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="25" y="105" width="95" height="60" rx="10" fill="#57606a"/>
    <text x="72" y="131">Spec</text>
    <text x="72" y="150" font-size="11" font-weight="400">/noir-spec</text>

    <rect x="135" y="105" width="95" height="60" rx="10" fill="#57606a"/>
    <text x="182" y="131">Approve</text>
    <text x="182" y="150" font-size="11" font-weight="400">noir:ready</text>

    <rect x="275" y="105" width="115" height="60" rx="10" fill="#6f42c1"/>
    <text x="332" y="131">Seal</text>
    <text x="332" y="150" font-size="11" font-weight="400">hidden tests</text>

    <rect x="410" y="105" width="115" height="60" rx="10" fill="#0969da"/>
    <text x="467" y="131">Build</text>
    <text x="467" y="150" font-size="11" font-weight="400">Claude Code</text>

    <rect x="545" y="105" width="115" height="60" rx="10" fill="#0969da"/>
    <text x="602" y="131">Measure</text>
    <text x="602" y="150" font-size="11" font-weight="400">lock · PIT · CRAP</text>

    <rect x="680" y="105" width="115" height="60" rx="10" fill="#0969da"/>
    <text x="737" y="131">Grade</text>
    <text x="737" y="150" font-size="11" font-weight="400">hidden tests</text>

    <rect x="815" y="105" width="120" height="60" rx="10" fill="#1a7f37"/>
    <text x="875" y="131">Pull request</text>
    <text x="875" y="150" font-size="11" font-weight="400">for your review</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="120" y1="135" x2="133" y2="135"/>
    <line x1="230" y1="135" x2="273" y2="135"/>
    <line x1="390" y1="135" x2="408" y2="135"/>
    <line x1="525" y1="135" x2="543" y2="135"/>
    <line x1="660" y1="135" x2="678" y2="135"/>
    <line x1="795" y1="135" x2="813" y2="135"/>
  </g>

  <!-- vault: sealed tests never reach the builder -->
  <rect x="275" y="250" width="520" height="44" rx="10" fill="#6f42c1" fill-opacity="0.14" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="535" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#8250df">Sealed vault</text>
  <text x="535" y="286" text-anchor="middle" font-size="11" fill="#8b949e">hidden tests + commitment · never shown to the builder</text>
  <g stroke="#8250df" stroke-width="1.5" fill="none" stroke-dasharray="4 3">
    <line x1="332" y1="165" x2="332" y2="250"/>
    <line x1="737" y1="250" x2="737" y2="167" marker-end="url(#arrow)"/>
  </g>

  <!-- rework loop: measure / grade back to build -->
  <path d="M 602 105 C 602 82, 495 82, 492 103" stroke="#d4a017" stroke-width="2" fill="none" marker-end="url(#arrow-amber)"/>
  <path d="M 737 105 C 737 50, 445 50, 442 103" stroke="#d4a017" stroke-width="2" fill="none" marker-end="url(#arrow-amber)"/>
  <text x="590" y="40" text-anchor="middle" font-size="12" fill="#d4a017">rework with feedback (pass counts only, never test code)</text>

  <!-- rejection loop: seal back to spec -->
  <path d="M 332 165 C 332 228, 72 228, 72 167" stroke="#d1495b" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <text x="200" y="240" text-anchor="middle" font-size="12" fill="#d1495b">rejected: comment + back to draft</text>
</svg>
